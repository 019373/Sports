<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e13"><title>Triathlon | Mon entraînement</title>
<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

dding-bottom:3px;margin-bottom:14px}.filters .btn{white-space:nowrap}.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 14px;text-align:center;font-size:14px;color:var(--muted);line-height:1.55}.div{height:1px;background:var(--line);margin:17px 0}details{margin-top:12px}summary{font-size:13px;color:var(--blue);cursor:pointer;font-weight:650}details[open] summary{margin-bottom:12px}.group{background:#111720;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px}.gtitle{font-weight:700;font-size:13px;margin-bottom:8px}.phase{padding:8px 10px;margin:6px 0;border-left:3px solid var(--blue);background:#1c2632;border-radius:5px;font-size:13px}.phase.rest{border-color:var(--green)}.phase.transition{border-color:var(--orange)}.phase .label{font-weight:700}.phase .detail{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.45}.notice{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.55}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#111820f2;border-top:1px solid var(--line);padding:7px 3px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}nav button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:650;min-width:58px;padding:10px 2px}nav button.on{color:var(--blue)}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:15px 0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;padding:5px 0 9px;color:var(--muted);font-size:11px}.day{background:var(--card);border:1px solid var(--line);border-radius:9px;min-width:0;min-height:73px;padding:8px 4px;text-align:left;color:var(--text)}.day.other{opacity:.35}.day.selected{border-color:var(--blue);background:#19283b}.day.today .daynum{color:var(--blue);font-weight:800}.daynum{font-size:13px}.dots{display:flex;gap:3px;margin-top:9px;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}.dot.run{background:var(--green)}.dot.bike{background:var(--blue)}.dot.swim{background:var(--purple)}.dot.brick{background:var(--orange)}.dot.rest{background:#697788}.daynote{font-size:10px;color:var(--muted);margin-top:6px}.weekrow{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:11px;text-align:left;padding:12px;margin:4px 0}.weekrow.selected{border-color:var(--blue)}
dialog{width:min(95vw,550px);max-height:86vh;overflow-y:auto;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text)}dialog::backdrop{background:#000b}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.dialoghead h2{margin:0}.form{display:grid;gap:13px;margin-top:15px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select{min-height:43px;width:100%;background:#222b37;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:16px}.field textarea{min-height:90px;resize:vertical}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:7px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.progress{height:7px;border-radius:10px;background:var(--line);overflow:hidden}.progress>div{height:100%;background:var(--green);border-radius:10px}a{color:var(--blue);overflow-wrap:anywhere}

<script>
(()=>{'use strict';
const KEY='triathlon-perso-v1',FORMAT=2;
const NAMES={run:'Course à pied',bike:'Vélo',swim:'Natation',brick:'Enchaînement'};
const CATS={endurance:'Endurance',tempo:'Tempo',seuil:'Seuil',vma:'VMA',vo2:'PMA / VO2 max',sprint:'Sprint',specifique:'Allure spécifique',lactique:'Lactique',autre:'Autre'};
const RSPORT={run:'Course à pied',bike:'Cyclisme',swim:'Natation',brick:'Triathlon',other:'Autre'};
const RSTATUS={wishlist:'Envisagée',registered:'Inscrite',completed:'Terminée',cancelled:'Annulée'};
const WD=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const r=(label,detail='',target=null,kind='work')=>({label,detail,target,kind});
const g=(title,reps,parts,extra='',rounds=1)=>({title,reps,parts,extra,rounds});
const s=(id,sport,cat,name,description,steps,extra={})=>({id:'src-'+id,sport,category:cat,name,description,steps,source:'Séance issue des fichiers fournis',minutes:0,goal:'',...extra});
const SEEDS=[
 s('bike-z2','bike','endurance','Z2 · Sortie endurance','Sortie de 4 à 6 h, environ 80 à 120 km, en endurance fondamentale.',[g('Sortie longue',1,[r('Endurance Z2','4 à 6 h · 80 à 120 km')])]),
 s('bike-z3-force','bike','tempo','Z3 · Force sous-maximale','Pédalage efficace, forte résistance et faible cadence. Les contre-efforts sont en vélocité.',[g('Force sous-maximale',6,[r('Effort','3 min · Z3 · 55 tr/min',{metric:'pma',lo:65,hi:75}),r('Contre-effort','2 min · Z2 · au moins 100 tr/min',{metric:'pma',lo:50},'rest')],'6 répétitions consécutives')]),
 s('bike-z4-pma','bike','seuil','Z4 · Intervalles au seuil (PMA)','Intervalles au seuil, avec maintien d’un effort prolongé.',[g('Seuil',4,[r('Effort','5 min · Z4',{metric:'pma',lo:75,hi:80}),r('Récupération','5 min · Z2',{metric:'pma',lo:50},'rest')])]),
 s('bike-z4-fc','bike','seuil','Z4 · Intervalles au seuil (FC)','Chercher une fréquence cardiaque stable en zone 4 pendant les efforts.',[g('Seuil cardiaque',4,[r('Effort','6 min · Z4',{metric:'fcmax',lo:92,hi:96})],'10 min en Z1–Z2 entre les efforts, pas après le dernier')]),
 s('bike-over-under','bike','seuil','Over/Under · FTP','Séance sur home trainer ou côte régulière. De 3 à 4 séries de cinq alternances.',[g('Over/Under',5,[r('Over','1 min',{metric:'ftp',lo:110}),r('Under','1 min',{metric:'ftp',lo:90})],'3 min en Z1–Z2 ENTRE les séries',3)],{goal:'3 séries au départ ; possibilité de passer à 4'}),
 s('bike-ftp-haut','bike','seuil','Fractionné seuil haut · FTP','Avec capteur de puissance ou home trainer. Commencer par 3 répétitions, passer ensuite à 4.',[g('Fractionné haut',3,[r('Effort','6 min',{metric:'ftp',lo:110}),r('Récupération','6 min · Z1–Z2',null,'rest')],'3 répétitions, puis éventuellement 4')]),
 s('bike-pma-3015','bike','vo2','PMA · 3 × 10 × (30/15)','Fractionné court conçu pour maintenir un effort intense avec récupération brève.',[g('PMA 30/15',10,[r('Effort','30 secondes · Z5',{metric:'pma',lo:100}),r('Contre-effort','15 secondes · Z2',{metric:'pma',lo:50},'rest')],'3 min de récupération ENTRE les séries',3)]),
 s('bike-gimenez','bike','vo2','PMA · Gimenez','Séance intense nécessitant une progression préalable.',[g('Gimenez',9,[r('Effort','1 min · Z5',{metric:'pma',lo:100}),r('Contre-effort','4 min · Z3',{metric:'pma',lo:65,hi:75},'rest')])]),
 s('bike-mix','bike','vo2','PMA · Efforts mixtes','Séance alternant PMA et seuil haut pour simuler les changements de rythme.',[g('Efforts mixtes',3,[r('PMA','1 min · Z5',{metric:'pma',lo:100}),r('Seuil','2 min · Z4',{metric:'pma',lo:80}),r('Récupération','3 min · Z2',{metric:'pma',lo:50},'rest')])]),
 s('bike-sprint-assis','bike','sprint','Sprint assis · Hypervélocité','Assis, petit plateau, cadence maximale. Récupération complète et longue. Le nombre de répétitions n’est pas précisé.',[g('Sprint',1,[r('Effort','8 à 12 secondes · intensité maximale · assis sur la selle'),r('Récupération','Complète et longue, sans durée précisée',null,'rest')])]),
 s('bike-sprint-danseuse','bike','sprint','Sprint lancé · Danseuse','Départ lancé, petit plateau, haute cadence. Récupération complète et longue. Nombre de répétitions non précisé.',[g('Sprint',1,[r('Effort','10 à 20 secondes · intensité maximale · en danseuse'),r('Récupération','Complète et longue, sans durée précisée',null,'rest')])]),
 s('bike-sprint-force','bike','sprint','Sprint en force explosive','Grand plateau, gros braquet, départ arrêté ou vers 15 km/h, accélération forte. Nombre de répétitions non précisé.',[g('Sprint',1,[r('Effort','8 à 12 secondes · intensité maximale'),r('Récupération','Complète et longue, sans durée précisée',null,'rest')])]),
 s('bike-sprint-long','bike','sprint','Sprint long · Tolérance aux lactates','Grand plateau, intensité maximale ou quasi maximale. Nombre de répétitions non précisé.',[g('Sprint long',1,[r('Effort','25 à 30 secondes · maximal / quasi maximal'),r('Récupération','Au moins 2 min ; idéalement assez longue pour conserver la puissance',null,'rest')])]),
 s('run-2k-400','run','vma','Objectif 2 km · 10 × 400 m','Objectif source : moins de 6 min sur 2 km. Les allures ne sont pas automatiquement adaptées au 3 km.',[g('VMA',10,[r('400 m','1 min 09 à 1 min 10'),r('Récupération','1 min de trottinement très lent',null,'rest')])],{goal:'Sub 6 min au 2 km'}),
 s('run-2k-600','run','vma','Objectif 2 km · 6 × 600 m','Séance VMA du programme pour le 2 km.',[g('VMA',6,[r('600 m','1 min 45 à 1 min 47'),r('Récupération','1 min 30 à 1 min 45, passive ou trottée',null,'rest')])],{goal:'Sub 6 min au 2 km'}),
 s('run-2k-500','run','specifique','Objectif 2 km · 5 × 500 m','Séance brisée de capacité lactique à allure spécifique.',[g('Allure spécifique',5,[r('500 m','1 min 29'),r('Récupération','2 min passive',null,'rest')])],{goal:'Sub 6 min au 2 km'}),
 s('run-2k-pyramide','run','specifique','Objectif 2 km · Pyramide','Chaque fraction est courue à l’allure cible ou un peu plus vite.',[g('Pyramide',1,[r('800 m','2 min 23'),r('Récupération','3 min',null,'rest'),r('600 m','1 min 47'),r('Récupération','2 min 30',null,'rest'),r('400 m','1 min 11'),r('Récupération','2 min',null,'rest'),r('200 m','33 secondes')])],{goal:'Sub 6 min au 2 km'}),
 s('run-2k-300200','run','lactique','Objectif 2 km · 3 × (300 + 200 m)','Travail de sur-vitesse et de tolérance lactique.',[g('300 + 200',3,[r('300 m','48 secondes'),r('Récupération','45 secondes',null,'rest'),r('200 m','30 secondes')],'4 à 5 min entre les blocs')],{goal:'Sub 6 min au 2 km'}),
 s('10k-i-1','run','vma','10 km · 10 × 400 m','Programme sub 45 min · semaines 1 à 3.',[g('Fractionné',10,[r('400 m','3:55/km'),r('Récupération','1 min 15',null,'rest')])],{programSlot:'interval',programPhase:0}),
 s('10k-i-2','run','vma','10 km · 5 × 1 000 m','Programme sub 45 min · semaines 4 à 6.',[g('Fractionné',5,[r('1 000 m','4:00/km'),r('Récupération','1 min 30',null,'rest')])],{programSlot:'interval',programPhase:1}),
 s('10k-i-3','run','vma','10 km · 6 × 800 m','Programme sub 45 min · semaines 7 à 9. Le fichier ne précise pas la récupération.',[g('Fractionné',6,[r('800 m','3:50/km'),r('Récupération','Non précisée dans le fichier',null,'rest')])],{programSlot:'interval',programPhase:2}),
 s('10k-i-4','run','vma','10 km · 4 × 400 m (semaine de course)','Programme sub 45 min · semaine 10. Récupération longue, durée non précisée.',[g('Fractionné',4,[r('400 m','Allure cible 10 km',{metric:'pace10k'}),r('Récupération','Longue, durée non précisée',null,'rest')])],{programSlot:'interval',programPhase:3}),
 s('10k-t-1','run','tempo','10 km · 2 × 10 min tempo','Programme sub 45 min · semaines 1 à 3.',[g('Tempo',2,[r('Effort','10 min à 4:45/km')],'Récupération non précisée dans le fichier')],{programSlot:'tempo',programPhase:0}),
 s('10k-t-2','run','tempo','10 km · 3 × 2 km tempo','Programme sub 45 min · semaines 4 à 6.',[g('Tempo',3,[r('2 km','4:30/km'),r('Récupération','2 min',null,'rest')])],{programSlot:'tempo',programPhase:1}),
 s('10k-t-3','run','tempo','10 km · 2 × 3 km tempo','Programme sub 45 min · semaines 7 à 9.',[g('Tempo',2,[r('3 km','4:28/km'),r('Récupération','2 min 30',null,'rest')])],{programSlot:'tempo',programPhase:2}),
 s('10k-t-4','run','tempo','10 km · 2 × 3 km (semaine de course)','Programme sub 45 min · semaine 10. Séance reprise telle quelle depuis le fichier.',[g('Tempo',2,[r('3 km','4:28/km'),r('Récupération','2 min 30',null,'rest')])],{programSlot:'tempo',programPhase:3}),
 s('10k-l-1','run','endurance','10 km · 12 à 14 km endurance','Programme sub 45 min · semaines 1 à 3.',[g('Sortie longue',1,[r('Endurance fondamentale','12 à 14 km')])],{programSlot:'long',programPhase:0}),
 s('10k-l-2','run','endurance','10 km · 14 à 16 km progressif','Programme sub 45 min · semaines 4 à 6.',[g('Sortie longue',1,[r('Endurance fondamentale','14 à 16 km au total'),r('Fin plus rapide','3 derniers km à 5:00/km')])],{programSlot:'long',programPhase:1}),
 s('10k-l-3','run','endurance','10 km · 12 km dont 4 km cible','Programme sub 45 min · semaines 7 à 9.',[g('Sortie longue',1,[r('Première partie','8 km en endurance'),r('Fin à allure cible','4 derniers km',{metric:'pace10k'})])],{programSlot:'long',programPhase:2}),
 s('10k-l-4','run','endurance','10 km · Footing pré-course','Programme sub 45 min · semaine 10.',[g('Footing léger',1,[r('Footing','20 min léger'),r('Accélérations','3 accélérations · durée non précisée')])],{programSlot:'long',programPhase:3})
];
const PROGRAM={title:'10 km · Objectif moins de 45 min',slots:{interval:['src-10k-i-1','src-10k-i-2','src-10k-i-3','src-10k-i-4'],tempo:['src-10k-t-1','src-10k-t-2','src-10k-t-3','src-10k-t-4'],long:['src-10k-l-1','src-10k-l-2','src-10k-l-3','src-10k-l-4']}};
const blank=()=>({sessions:[],planned:[],races:[],programs:[],restDays:[],settings:{ftp:'',pma:'',fcmax:'',pace10k:'',pace2k:''},seedVersion:0,schemaVersion:FORMAT});
const isObj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDay=x=>new Date(x+'T12:00:00');
const plusDays=(d,n)=>{let t=new Date(d);t.setDate(t.getDate()+n);return t};
const monday=d=>plusDays(d,-((d.getDay()+6)%7));
const validDay=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(parseDay(x).valueOf())&&iso(parseDay(x))===x;
const dayLabel=x=>validDay(x)?parseDay(x).toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'Date inconnue';
const monthLabel=d=>d.toLocaleDateString('fr-CH',{month:'long',year:'numeric'});
const dayDiff=(a,b)=>Math.round((parseDay(b)-parseDay(a))/86400000);
const sortPlanned=a=>[...a].sort((x,y)=>(x.date+' '+(x.time||'')).localeCompare(y.date+' '+(y.time||'')));
const sortRaces=a=>[...a].sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999'));
function normalize(raw){
 if(!isObj(raw)||!['sessions','planned','races'].every(k=>Array.isArray(raw[k])&&raw[k].length<=10000))throw Error('Fichier invalide : listes manquantes ou trop longues.');
 if(!['sessions','planned','races'].every(k=>raw[k].every(isObj)))throw Error('Entrée invalide dans une liste.');
 const x=blank();

  if(type==='planned')return (item.date||'')+'|'+(item.time||'')+'|'+(item.name||'')+'|'+(item.programId||'');
  if(type==='races')return (item.name||'').toLowerCase().trim()+'|'+(item.date||'');
  return (item.title||'')+'|'+(item.startDate||'');
 };
 for(const type of ['sessions','planned','races','programs']){
  const ids=new Set(result[type].map(q=>q.id));const fps=new Set(result[type].map(q=>fingerprint(q,type)));
  for(const item of incoming[type]){const fp=fingerprint(item,type);if(!ids.has(item.id)&&!fps.has(fp)){result[type].push(item);ids.add(item.id);fps.add(fp)}}

 ${field('Chrono ou valeur (ex. 22:30 ou 250 W)','value','','text',true)}
 ${field('Note', 'note','')}${endForm('Ajouter un repère')}</form>
 <div class="div"></div><h3>Historique</h3>
 ${records.length?records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row recordrow"><div><strong>${escapeHTML(categories.find(y=>y[0]===x.type)?.[1]||x.type)}</strong><div class="meta">${escapeHTML(dayLabel(x.date))} · ${escapeHTML(x.value)} ${escapeHTML(x.note||'')}</div></div>${btn('Supprimer','record-delete',x.id,'danger compact')}</div>`).join(''):empty('Aucun repère enregistré.')}`);
}
function secFmt(s){s=Math.max(0,Math.round(Number(s)||0));return s%60?`${Math.floor(s/60)} min ${s%60} s`:`${s/60} min`}
function builderRow(v={}){
 return `<div class="group builder-block" data-builder-row><div class="row"><div class="gtitle">Bloc de fractionné</div>${btn('Retirer','builder-remove','','compact danger')}</div>
 <div class="grid">
 ${field('Séries','sets',v.sets??1,'number')}${field('Répétitions / série','reps',v.reps??6,'number')}
 ${field('Effort (secondes)','effort',v.effort??60,'number')}${field('Récup. entre répétitions (s)','rest',v.rest??60,'number')}
 ${field('Récup. entre séries (s)','seriesRest',v.seriesRest??180,'number')}${field('Distance par effort (m, facultatif)','distance',v.distance??0,'number')}
 </div>
 ${field('Consigne d’effort (allure, technique, zone...)','goal',v.goal||'')}
 ${sel('Cible calculée','metric',[['','Aucune'],['ftp','% FTP vélo'],['pma','% PMA vélo'],['fcmax','% FC max']],v.metric||'')}
 ${field('Pourcentage de la référence','percent',v.percent??100,'number')}</div>`;
}
function getBuilder(){
 const form=document.querySelector('form[data-form="builder"]');if(!form)return null;
 const v=Object.fromEntries(new FormData(form).entries());
 const val=(scope,k)=>scope.querySelector(`[name="${k}"]`)?.value??'';
 const number=(scope,k)=>Math.max(0,Math.min(999999,Number(val(scope,k))||0));
 const blocks=[...form.querySelectorAll('[data-builder-row]')].map(scope=>({
  sets:Math.floor(number(scope,'sets')),reps:Math.floor(number(scope,'reps')),
  effort:Math.floor(number(scope,'effort')),rest:Math.floor(number(scope,'rest')),
  seriesRest:Math.floor(number(scope,'seriesRest')),distance:Math.floor(number(scope,'distance')),
  goal:val(scope,'goal').trim(),metric:val(scope,'metric'),percent:number(scope,'percent')
 }));
 return {name:(v.name||'').trim(),sport:v.sport,category:v.category,
  description:(v.description||'').trim(),warmup:Math.floor(Number(v.warmup)||0),
  cooldown:Math.floor(Number(v.cooldown)||0),warmDist:Math.floor(Number(v.warmDist)||0),
  coolDist:Math.floor(Number(v.coolDist)||0),blocks};
}
function calculateBuilder(b){
 let duration=60*(b.warmup+b.cooldown),distance=b.warmDist+b.coolDist;
 for(const a of b.blocks){
  duration+=a.sets*(a.reps*a.effort+Math.max(0,a.reps-1)*a.rest)+Math.max(0,a.sets-1)*a.seriesRest;
  distance+=a.sets*a.reps*a.distance;
 }
 return {duration,distance};
}
function builderSteps(b){
 const out=[];
 if(b.warmup||b.warmDist)out.push(g('Échauffement',1,[r('Échauffement',`${b.warmup} min${b.warmDist?' · '+b.warmDist+' m':''}`)]));
 b.blocks.forEach((a,i)=>{
  const target=a.metric&&a.percent?{metric:a.metric,lo:a.percent}:null;
  const parts=[r('Effort',`${secFmt(a.effort)}${a.distance?' · '+a.distance+' m':''}${a.goal?' · '+a.goal:''}`,target)];
  if(a.rest)parts.push(r('Récupération',secFmt(a.rest)+' entre les répétitions (pas après la dernière)',null,'rest'));
  out.push(g('Bloc '+(i+1),a.reps,parts,a.sets>1?`Récupération entre séries : ${secFmt(a.seriesRest)}. Aucune récupération après la dernière série.`:'',a.sets));
 });
 if(b.cooldown||b.coolDist)out.push(g('Retour au calme',1,[r('Retour au calme',`${b.cooldown} min${b.coolDist?' · '+b.coolDist+' m':''}`)]));
 return out;
}
function updateBuilder(){
 const form=document.querySelector('form[data-form="builder"]'),b=getBuilder();if(!form||!b)return;
 const {duration,distance}=calculateBuilder(b);
 const el=form.querySelector('#builder-total');if(el)el.textContent=`Durée estimée : ${secFmt(duration)}${distance?' · Distance : '+distance+' m':''}`;
}
function builderForm(id=''){
 const x=data.sessions.find(s=>s.id===id),v=x&&x.builderV3?x.builderV3:{};
 show(id?'Modifier le fractionné':'Créer un fractionné',`<form class="form" data-form="builder" data-id="${escapeHTML(id)}">
 ${field('Nom *','name',v.name||x?.name||'','text',true)}
 ${sel('Sport','sport',[['run','Course à pied'],['bike','Vélo'],['swim','Natation']],v.sport||x?.sport||'run')}
 ${sel('Objectif','category',Object.entries(CATS),v.category||'vma')}
 ${txt('Description','description',v.description||'')}
 <div class="grid">${field('Échauffement (minutes)','warmup',v.warmup??10,'number')}${field('Retour au calme (minutes)','cooldown',v.cooldown??10,'number')}
 ${field('Échauffement (mètres, facultatif)','warmDist',v.warmDist??0,'number')}${field('Retour au calme (mètres, facultatif)','coolDist',v.coolDist??0,'number')}</div>
 <div id="builder-rows">${(Array.isArray(v.blocks)&&v.blocks.length?v.blocks:[{}]).map(builderRow).join('')}</div>
 <div class="actions">${btn('+ Ajouter un bloc','builder-add')}</div>
 <div id="builder-total" class="card" style="margin:0" aria-live="polite"></div>
 <p class="hint">La durée suppose qu’il n’y a pas de récupération après la dernière répétition d’une série, ni après la dernière série.</p>
 ${endForm('Enregistrer dans la bibliothèque')}</form>`);
 updateBuilder();
}
function interceptClickV3(e){
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id;
 if(!['builder-new','builder-edit','builder-add','builder-remove','race-prep','records','record-delete'].includes(a))return;
 e.preventDefault();e.stopImmediatePropagation();
 if(a==='builder-new'){builderForm();return}
 if(a==='builder-edit'){builderForm(id);return}
 if(a==='builder-add'){document.querySelector('#builder-rows')?.insertAdjacentHTML('beforeend',builderRow({}));updateBuilder();return}
 if(a==='builder-remove'){const row=b.closest('[data-builder-row]');if(document.querySelectorAll('[data-builder-row]').length<=1){alert('Conserve au moins un bloc.');return}row?.remove();updateBuilder();return}
 if(a==='race-prep'){racePrepForm(id);return}
 if(a==='records'){recordsView();return}
 if(a==='record-delete'){
  if(!confirm('Supprimer ce repère ?'))return;
  data.settings.records=(data.settings.records||[]).filter(x=>x.id!==id);save();recordsView();return;
 }
}
document.addEventListener('click',interceptClickV3,true);
document.addEventListener('input',e=>{if(e.target.closest('form[data-form="builder"]'))updateBuilder()});
function interceptSubmitV3(e){
 const form=e.target;if(!form.matches('form[data-form="builder"],form[data-form="race-prep"],form[data-form="record"]'))return;
 e.preventDefault();e.stopImmediatePropagation();
 const type=form.dataset.form,id=form.dataset.id;
 if(type==='builder'){
  const b=getBuilder();if(!b||!b.name){alert('Donne un nom à la séance.');return}
  if(!['run','bike','swim'].includes(b.sport)||!CATS[b.category]||!b.blocks.length||
    b.blocks.some(x=>x.sets<1||x.sets>20||x.reps<1||x.reps>100||x.effort<1||x.effort>86400||x.percent>500)||
    b.warmup<0||b.cooldown<0||b.warmDist<0||b.coolDist<0){alert('Vérifie les blocs, les répétitions et les durées.');return}
  const totals=calculateBuilder(b);
  if(totals.duration>24*3600){alert('La durée dépasse 24 heures.');return}
  const values={name:b.name,sport:b.sport,category:b.category,description:b.description,
    minutes:Math.ceil(totals.duration/60),totalMeters:totals.distance,steps:builderSteps(b),
    goal:'',builderV3:b,source:'Créée avec le constructeur de fractionnés'};
  const old=data.sessions.find(x=>x.id===id);
  if(old)Object.assign(old,values);else data.sessions.push({id:uid(),...values});
  tab='library';libTab='library';save();close();render();return;
 }
 if(type==='race-prep'){
  const x=data.races.find(q=>q.id===id);if(!x)return;
  const v=Object.fromEntries(new FormData(form).entries());
  const days=Number(v.prepDays);if(!Number.isInteger(days)||days<0||days>28){alert('Choisis entre 0 et 28 jours.');return}
  x.prepDays=days;x.prepNotes=(v.prepNotes||'').trim();x.prepChecks=Object.fromEntries(['registration','equipment','travel','bib'].map(k=>[k,!!v[k]]));
  save();close();render();return;
 }
 if(type==='record'){
  const v=Object.fromEntries(new FormData(form).entries());
  if(!validDay(v.date)||!v.value?.trim()){alert('Date ou valeur incorrecte.');return}
  if(!Array.isArray(data.settings.records))data.settings.records=[];
  data.settings.records.push({id:uid(),type:v.type,date:v.date,value:v.value.trim(),note:(v.note||'').trim()});
  save();recordsView();return;
 }
}
document.addEventListener('submit',interceptSubmitV3,true);
// Préserver les filtres après une sélection dans le formulaire de catégories.
document.addEventListener('change',e=>{if(e.target.dataset.change==='category')setTimeout(persistUI,0)});
// Service worker : uniquement sur HTTPS ou localhost, pas dans la prévisualisation file://.
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Mode hors ligne indisponible',err)));
}

render();
})();
</script></body></html>
