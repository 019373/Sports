/* TRIATHLON V4.1 MOBILE COMPACT */

html, body {

  max-width:100%;
  overflow-x:clip;
}

html {
  scroll-padding-top:84px !important;
}

body {
  margin:0 !important;
}

.head,

  box-sizing:border-box !important;
  height:auto !important;

}

main .card,

  height:auto !important;

main .actions .btn,

  min-height:37px !important;
  padding:8px 10px !important;
  font-size:12px !important;

<script>
(()=>{'use strict';
const KEY='triathlon-perso-v1',FORMAT=2;
const NAMES={run:'Course à pied',bike:'Vélo',swim:'Natation',brick:'Enchaînement'};
const CATS={endurance:'Endurance',tempo:'Tempo',seuil:'Seuil',vma:'VMA',vo2:'PMA / VO2 max',sprint:'Sprint',specifique:'Allure spécifique',lactique:'Lactique',autre:'Autre'};
const RSPORT={run:'Course à pied',bike:'Cyclisme',swim:'Natation',brick:'Triathlon',other:'Autre'};
const RSTATUS={wishlist:'Envisagée',registered:'Inscrite',completed:'Terminée',cancelled:'Annulée'};
const WD=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const r=(label,detail='',target=null,kind='work')=>({label,detail,target,kind});
const g=(title,reps,parts,extra='',rounds=1)=>({title,reps,parts,extra,rounds});
const s=(id,sport,cat,name,description,steps,extra={})=>({id:'src-'+id,sport,category:cat,name,description,steps,source:'Séance issue des fichiers fournis',minutes:0,goal:'',...extra});
const SEEDS=[
 s('bike-z2','bike','endurance','Z2 · Sortie endurance','Sortie de 4 à 6 h, environ 80 à 120 km, en endurance fondamentale.',[g('Sortie longue',1,[r('Endurance Z2','4 à 6 h · 80 à 120 km')])]),
 s('bike-z3-force','bike','tempo','Z3 · Force sous-maximale','Pédalage efficace, forte résistance et faible cadence. Les contre-efforts sont en vélocité.',[g('Force sous-maximale',6,[r('Effort','3 min · Z3 · 55 tr/min',{metric:'pma',lo:65,hi:75}),r('Contre-effort','2 min · Z2 · au moins 100 tr/min',{metric:'pma',lo:50},'rest')],'6 répétitions consécutives')]),
 s('bike-z4-pma','bike','seuil','Z4 · Intervalles au seuil (PMA)','Intervalles au seuil, avec maintien d’un effort prolongé.',[g('Seuil',4,[r('Effort','5 min · Z4',{metric:'pma',lo:75,hi:80}),r('Récupération','5 min · Z2',{metric:'pma',lo:50},'rest')])]),
 s('bike-z4-fc','bike','seuil','Z4 · Intervalles au seuil (FC)','Chercher une fréquence cardiaque stable en zone 4 pendant les efforts.',[g('Seuil cardiaque',4,[r('Effort','6 min · Z4',{metric:'fcmax',lo:92,hi:96})],'10 min en Z1–Z2 entre les efforts, pas après le dernier')]),
 s('bike-over-under','bike','seuil','Over/Under · FTP','Séance sur home trainer ou côte régulière. De 3 à 4 séries de cinq alternances.',[g('Over/Under',5,[r('Over','1 min',{metric:'ftp',lo:110}),r('Under','1 min',{metric:'ftp',lo:90})],'3 min en Z1–Z2 ENTRE les séries',3)],{goal:'3 séries au départ ; possibilité de passer à 4'}),
 s('bike-ftp-haut','bike','seuil','Fractionné seuil haut · FTP','Avec capteur de puissance ou home trainer. Commencer par 3 répétitions, passer ensuite à 4.',[g('Fractionné haut',3,[r('Effort','6 min',{metric:'ftp',lo:110}),r('Récupération','6 min · Z1–Z2',null,'rest')],'3 répétitions, puis éventuellement 4')]),
 s('bike-pma-3015','bike','vo2','PMA · 3 × 10 × (30/15)','Fractionné court conçu pour maintenir un effort intense avec récupération brève.',[g('PMA 30/15',10,[r('Effort','30 secondes · Z5',{metric:'pma',lo:100}),r('Contre-effort','15 secondes · Z2',{metric:'pma',lo:50},'rest')],'3 min de récupération ENTRE les séries',3)]),
 s('bike-gimenez','bike','vo2','PMA · Gimenez','Séance intense nécessitant une progression préalable.',[g('Gimenez',9,[r('Effort','1 min · Z5',{metric:'pma',lo:100}),r('Contre-effort','4 min · Z3',{metric:'pma',lo:65,hi:75},'rest')])]),
 s('bike-mix','bike','vo2','PMA · Efforts mixtes','Séance alternant PMA et seuil haut pour simuler les changements de rythme.',[g('Efforts mixtes',3,[r('PMA','1 min · Z5',{metric:'pma',lo:100}),r('Seuil','2 min · Z4',{metric:'pma',lo:80}),r('Récupération','3 min · Z2',{metric:'pma',lo:50},'rest')])]),
 s('bike-sprint-assis','bike','sprint','Sprint assis · Hypervélocité','Assis, petit plateau, cadence maximale. Récupération complète et longue. Le nombre de répétitions n’est pas précisé.',[g('Sprint',1,[r('Effort','8 à 12 secondes · intensité maximale · assis sur la selle'),r('Récupération','Complète et longue, sans durée précisée',null,'rest')])]),
 s('bike-sprint-danseuse','bike','sprint','Sprint lancé · Danseuse','Départ lancé, petit plateau, haute cadence. Récupération complète et longue. Nombre de répétitions non précisé.',[g('Sprint',1,[r('Effort','10 à 20 secondes · intensité maximale · en danseuse'),r('Récupération','Complète et longue, sans durée précisée',null,'rest')])]),
 s('bike-sprint-force','bike','sprint','Sprint en force explosive','Grand plateau, gros braquet, départ arrêté ou vers 15 km/h, accélération forte. Nombre de répétitions non précisé.',[g('Sprint',1,[r('Effort','8 à 12 secondes · intensité maximale'),r('Récupération','Complète et longue, sans durée précisée',null,'rest')])]),
 s('bike-sprint-long','bike','sprint','Sprint long · Tolérance aux lactates','Grand plateau, intensité maximale ou quasi maximale. Nombre de répétitions non précisé.',[g('Sprint long',1,[r('Effort','25 à 30 secondes · maximal / quasi maximal'),r('Récupération','Au moins 2 min ; idéalement assez longue pour conserver la puissance',null,'rest')])]),
 s('run-2k-400','run','vma','Objectif 2 km · 10 × 400 m','Objectif source : moins de 6 min sur 2 km. Les allures ne sont pas automatiquement adaptées au 3 km.',[g('VMA',10,[r('400 m','1 min 09 à 1 min 10'),r('Récupération','1 min de trottinement très lent',null,'rest')])],{goal:'Sub 6 min au 2 km'}),
 s('run-2k-600','run','vma','Objectif 2 km · 6 × 600 m','Séance VMA du programme pour le 2 km.',[g('VMA',6,[r('600 m','1 min 45 à 1 min 47'),r('Récupération','1 min 30 à 1 min 45, passive ou trottée',null,'rest')])],{goal:'Sub 6 min au 2 km'}),
 s('run-2k-500','run','specifique','Objectif 2 km · 5 × 500 m','Séance brisée de capacité lactique à allure spécifique.',[g('Allure spécifique',5,[r('500 m','1 min 29'),r('Récupération','2 min passive',null,'rest')])],{goal:'Sub 6 min au 2 km'}),
 s('run-2k-pyramide','run','specifique','Objectif 2 km · Pyramide','Chaque fraction est courue à l’allure cible ou un peu plus vite.',[g('Pyramide',1,[r('800 m','2 min 23'),r('Récupération','3 min',null,'rest'),r('600 m','1 min 47'),r('Récupération','2 min 30',null,'rest'),r('400 m','1 min 11'),r('Récupération','2 min',null,'rest'),r('200 m','33 secondes')])],{goal:'Sub 6 min au 2 km'}),
 s('run-2k-300200','run','lactique','Objectif 2 km · 3 × (300 + 200 m)','Travail de sur-vitesse et de tolérance lactique.',[g('300 + 200',3,[r('300 m','48 secondes'),r('Récupération','45 secondes',null,'rest'),r('200 m','30 secondes')],'4 à 5 min entre les blocs')],{goal:'Sub 6 min au 2 km'}),
 s('10k-i-1','run','vma','10 km · 10 × 400 m','Programme sub 45 min · semaines 1 à 3.',[g('Fractionné',10,[r('400 m','3:55/km'),r('Récupération','1 min 15',null,'rest')])],{programSlot:'interval',programPhase:0}),
 s('10k-i-2','run','vma','10 km · 5 × 1 000 m','Programme sub 45 min · semaines 4 à 6.',[g('Fractionné',5,[r('1 000 m','4:00/km'),r('Récupération','1 min 30',null,'rest')])],{programSlot:'interval',programPhase:1}),
 s('10k-i-3','run','vma','10 km · 6 × 800 m','Programme sub 45 min · semaines 7 à 9. Le fichier ne précise pas la récupération.',[g('Fractionné',6,[r('800 m','3:50/km'),r('Récupération','Non précisée dans le fichier',null,'rest')])],{programSlot:'interval',programPhase:2}),
 s('10k-i-4','run','vma','10 km · 4 × 400 m (semaine de course)','Programme sub 45 min · semaine 10. Récupération longue, durée non précisée.',[g('Fractionné',4,[r('400 m','Allure cible 10 km',{metric:'pace10k'}),r('Récupération','Longue, durée non précisée',null,'rest')])],{programSlot:'interval',programPhase:3}),
 s('10k-t-1','run','tempo','10 km · 2 × 10 min tempo','Programme sub 45 min · semaines 1 à 3.',[g('Tempo',2,[r('Effort','10 min à 4:45/km')],'Récupération non précisée dans le fichier')],{programSlot:'tempo',programPhase:0}),
 s('10k-t-2','run','tempo','10 km · 3 × 2 km tempo','Programme sub 45 min · semaines 4 à 6.',[g('Tempo',3,[r('2 km','4:30/km'),r('Récupération','2 min',null,'rest')])],{programSlot:'tempo',programPhase:1}),
 s('10k-t-3','run','tempo','10 km · 2 × 3 km tempo','Programme sub 45 min · semaines 7 à 9.',[g('Tempo',2,[r('3 km','4:28/km'),r('Récupération','2 min 30',null,'rest')])],{programSlot:'tempo',programPhase:2}),
 s('10k-t-4','run','tempo','10 km · 2 × 3 km (semaine de course)','Programme sub 45 min · semaine 10. Séance reprise telle quelle depuis le fichier.',[g('Tempo',2,[r('3 km','4:28/km'),r('Récupération','2 min 30',null,'rest')])],{programSlot:'tempo',programPhase:3}),
 s('10k-l-1','run','endurance','10 km · 12 à 14 km endurance','Programme sub 45 min · semaines 1 à 3.',[g('Sortie longue',1,[r('Endurance fondamentale','12 à 14 km')])],{programSlot:'long',programPhase:0}),
 s('10k-l-2','run','endurance','10 km · 14 à 16 km progressif','Programme sub 45 min · semaines 4 à 6.',[g('Sortie longue',1,[r('Endurance fondamentale','14 à 16 km au total'),r('Fin plus rapide','3 derniers km à 5:00/km')])],{programSlot:'long',programPhase:1}),
 s('10k-l-3','run','endurance','10 km · 12 km dont 4 km cible','Programme sub 45 min · semaines 7 à 9.',[g('Sortie longue',1,[r('Première partie','8 km en endurance'),r('Fin à allure cible','4 derniers km',{metric:'pace10k'})])],{programSlot:'long',programPhase:2}),
 s('10k-l-4','run','endurance','10 km · Footing pré-course','Programme sub 45 min · semaine 10.',[g('Footing léger',1,[r('Footing','20 min léger'),r('Accélérations','3 accélérations · durée non précisée')])],{programSlot:'long',programPhase:3})
];
const PROGRAM={title:'10 km · Objectif moins de 45 min',slots:{interval:['src-10k-i-1','src-10k-i-2','src-10k-i-3','src-10k-i-4'],tempo:['src-10k-t-1','src-10k-t-2','src-10k-t-3','src-10k-t-4'],long:['src-10k-l-1','src-10k-l-2','src-10k-l-3','src-10k-l-4']}};
const blank=()=>({sessions:[],planned:[],races:[],programs:[],restDays:[],settings:{ftp:'',pma:'',fcmax:'',pace10k:'',pace2k:''},seedVersion:0,schemaVersion:FORMAT});
const isObj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDay=x=>new Date(x+'T12:00:00');
const plusDays=(d,n)=>{let t=new Date(d);t.setDate(t.getDate()+n);return t};
const monday=d=>plusDays(d,-((d.getDay()+6)%7));
const validDay=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(parseDay(x).valueOf())&&iso(parseDay(x))===x;
const dayLabel=x=>validDay(x)?parseDay(x).toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'Date inconnue';
const monthLabel=d=>d.toLocaleDateString('fr-CH',{month:'long',year:'numeric'});
const dayDiff=(a,b)=>Math.round((parseDay(b)-parseDay(a))/86400000);
const sortPlanned=a=>[...a].sort((x,y)=>(x.date+' '+(x.time||'')).localeCompare(y.date+' '+(y.time||'')));
const sortRaces=a=>[...a].sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999'));
function normalize(raw){
 if(!isObj(raw)||!['sessions','planned','races'].every(k=>Array.isArray(raw[k])&&raw[k].length<=10000))throw Error('Fichier invalide : listes manquantes ou trop longues.');
 if(!['sessions','planned','races'].every(k=>raw[k].every(isObj)))throw Error('Entrée invalide dans une liste.');
 const x=blank();
 x.sessions=raw.sessions.map(v=>({...v,id:String(v.id||uid()),name:String(v.name||'Séance'),sport:NAMES[v.sport]?v.sport:'run',category:CATS[v.category]?v.category:'autre',steps:Array.isArray(v.steps)?v.steps:[]}));
 x.planned=raw.planned.filter(v=>validDay(v.date)).map(v=>({...v,id:String(v.id||uid()),sport:NAMES[v.sport]?v.sport:'run',category:CATS[v.category]?v.category:'autre',name:String(v.name||'Entraînement'),steps:Array.isArray(v.steps)?v.steps:[],done:!!v.done}));
 x.races=raw.races.map(v=>({...v,id:String(v.id||uid()),name:String(v.name||'Course'),status:RSTATUS[v.status]?v.status:'wishlist'}));
 x.programs=Array.isArray(raw.programs)?raw.programs.filter(isObj).map(v=>({...v,id:String(v.id||uid())})):[];
 x.restDays=Array.isArray(raw.restDays)?[...new Set(raw.restDays.filter(validDay))]:[];
 x.settings=isObj(raw.settings)?{...x.settings,...raw.settings}:x.settings;
 x.seedVersion=Number(raw.seedVersion)||0;
 x.schemaVersion=FORMAT;
 return x;
}
function seed(x){if(x.seedVersion>=1)return;
 for(const template of SEEDS){if(!x.sessions.some(v=>v.id===template.id||(v.sport===template.sport&&v.name===template.name)))x.sessions.push(JSON.parse(JSON.stringify(template)))}
 x.seedVersion=1;
}
function getSaved(){try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw))}catch(e){alert('La sauvegarde locale ne peut pas être lue : '+e.message)}return blank()}
let data=getSaved();seed(data);
let tab='home',libTab='library',sportFilter='all',catFilter='all',raceFilter='all',calMode='month',viewDate=new Date(),selectedDate=iso(new Date());
let stagedImport=null;
const main=document.getElementById('main'),modal=document.getElementById('modal');
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Enregistrement impossible. Espace de stockage indisponible ou saturé.');return false}}
save();
function tag(t,cls=''){return `<span class="tag ${cls}">${escapeHTML(t)}</span>`}
function btn(t,a,id='',cls=''){return `<button class="btn ${cls}" data-a="${a}" data-id="${escapeHTML(id)}">${t}</button>`}
function top(title,desc,right=''){return `<div class="top"><div><h1>${title}</h1><p class="sub">${desc}</p></div>${right}</div>`}
function empty(t){return `<div class="empty">${escapeHTML(t)}</div>`}
function tabs(selected,entries,action){return `<div class="filters">${entries.map(([k,v])=>btn(v,action,k,selected===k?'on':'')).join('')}</div>`}
function numSetting(k){const n=Number(data.settings[k]);return Number.isFinite(n)&&n>0?n:null}
function parsePace(x){if(typeof x!=='string'||!/^\d{1,2}:\d{2}$/.test(x))return null;const [m,s]=x.split(':').map(Number);return s<60&&m>0?m*60+s:null}
function targetText(target){if(!isObj(target))return '';
 if(target.metric==='pace10k'||target.metric==='pace2k'){
  const p=data.settings[target.metric],s=parsePace(p);
  return s?`Allure personnelle : ${p}/km (${(3600/s).toFixed(1)} km/h)`:'Régler ton allure de référence dans Réglages';
 }
 const metric=target.metric;const n=numSetting(metric);const label=metric==='fcmax'?'FC max':metric==='ftp'?'FTP':'PMA';
 if(!['pma','ftp','fcmax'].includes(metric))return '';
 const pct=target.hi&&target.hi!==target.lo?`${target.lo}–${target.hi} %`:`${target.lo} %`;
 if(!n)return `${pct} ${label} · renseigner ${label} dans Réglages`;
 const lo=Math.round(n*Number(target.lo)/100),hi=target.hi?Math.round(n*Number(target.hi)/100):null;
 return `${pct} ${label} = ${lo}${hi&&hi!==lo?'–'+hi:''} ${metric==='fcmax'?'bpm':'W'}`;
}
function structured(steps){if(!Array.isArray(steps)||!steps.length)return '';
 return `<details><summary>Voir la séance étape par étape</summary>${steps.map(block=>{
  if(!isObj(block))return '';
  const rounds=Number(block.rounds)||1,reps=Number(block.reps)||1;
  const repTitle=(rounds>1?rounds+' séries × ':'')+(reps>1?reps+' répétitions':'1 bloc');
  return `<div class="group"><div class="gtitle">${escapeHTML(block.title||'Séquence')} · ${repTitle}</div>
   ${Array.isArray(block.parts)?block.parts.filter(isObj).map(p=>`<div class="phase ${p.kind==='rest'?'rest':p.kind==='transition'?'transition':''}"><div class="label">${escapeHTML(p.label)}</div><div class="detail">${escapeHTML(p.detail)}${p.target?'<br>'+escapeHTML(targetText(p.target)):''}</div></div>`).join(''):''}
   ${block.extra?`<div class="notice">${escapeHTML(block.extra)}</div>`:''}</div>`;
 }).join('')}</details>`;
}
function sessionCard(s){return `<article class="card"><div class="row"><div class="wrap">${tag(NAMES[s.sport]||'Sport',s.sport)}${tag(CATS[s.category]||'Autre')}</div>${s.programPhase!==undefined?tag('Programme 10 km'):''}</div>
 <div class="name">${escapeHTML(s.name)}</div>${s.minutes?`<div class="meta">${escapeHTML(s.minutes)} min</div>`:''}
 ${s.goal?`<div class="meta">Objectif : ${escapeHTML(s.goal)}</div>`:''}
 ${s.description?`<div class="desc">${escapeHTML(s.description)}</div>`:''}${structured(s.steps)}
 <div class="actions">${btn('Programmer','plan-from',s.id,'primary compact')}${btn('Modifier','session-edit',s.id,'compact')}${btn('Supprimer','session-del',s.id,'danger compact')}</div></article>`}
function planCard(p){return `<article class="card"><div class="row"><div class="wrap">${tag(NAMES[p.sport]||'Sport',p.sport)}${tag(CATS[p.category]||'Autre')}</div>${tag(p.done?'Terminée':'À faire',p.done?'good':'warn')}</div>
 <div class="name">${escapeHTML(p.name)}</div><div class="meta">${escapeHTML(dayLabel(p.date))}${p.time?' · '+escapeHTML(p.time):''}${p.minutes?' · '+escapeHTML(p.minutes)+' min':''}</div>
 ${p.programId?`<div class="meta">Programme : ${escapeHTML((data.programs.find(q=>q.id===p.programId)||{}).title||'Plan lié')}</div>`:''}
 ${p.goal?`<div class="meta">Objectif : ${escapeHTML(p.goal)}</div>`:''}${p.description?`<div class="desc">${escapeHTML(p.description)}</div>`:''}${structured(p.steps)}
 <div class="actions">${btn(p.done?'Remettre à faire':'Terminer','plan-done',p.id,'compact')}${btn('Déplacer / modifier','plan-edit',p.id,'compact')}${btn('Dupliquer / répéter','plan-duplicate',p.id,'compact')}${btn('Supprimer','plan-del',p.id,'danger compact')}</div></article>`}
function upcomingRace(){const today=iso(new Date());return sortRaces(data.races.filter(r=>validDay(r.date)&&r.date>=today&&['wishlist','registered'].includes(r.status)))[0]}
function renderHome(){const today=iso(new Date()),m=iso(monday(new Date())),end=iso(plusDays(monday(new Date()),6));
 const week=data.planned.filter(p=>p.date>=m&&p.date<=end),next=sortPlanned(data.planned.filter(p=>p.date>=today&&!p.done)).slice(0,3),race=upcomingRace();
 return top('Mon entraînement','Entraînements et compétitions au même endroit.')+`<div class="grid"><div class="card"><div class="meta">Séances cette semaine</div><div class="stat">${week.length}</div></div><div class="card"><div class="meta">Terminées cette semaine</div><div class="stat">${week.filter(p=>p.done).length}</div><div class="progress" aria-label="Progression de la semaine"><div style="width:${week.length?100*week.filter(p=>p.done).length/week.length:0}%"></div></div></div></div>
 <div class="section"><div class="row"><h2>À venir</h2>${btn('Calendrier','tab-calendar','','compact')}</div>${next.length?next.map(planCard).join(''):empty('Aucun entraînement programmé.')}</div>
 <div class="section"><h2>Prochaine course</h2>${race?`${raceCard(race)}<p class="muted small">Départ dans ${dayDiff(today,race.date)} jour(s).</p>`:empty('Aucune course future enregistrée.')}</div>`}
function renderLibrary(){if(libTab==='programs')return renderPrograms();
 const list=data.sessions.filter(s=>(sportFilter==='all'||s.sport===sportFilter)&&(catFilter==='all'||s.category===catFilter));
 return top('Mes séances','Bibliothèque : tes séances restent disponibles pour plusieurs entraînements.',btn('+ Ajouter','session-new','','primary'))+

function mergeData(local,incoming){const result=JSON.parse(JSON.stringify(local));
 const fingerprint=(item,type)=>{
  if(type==='sessions')return (item.sport||'')+'|'+String(item.name||'').toLowerCase().trim();
  if(type==='planned')return (item.date||'')+'|'+(item.time||'')+'|'+(item.name||'')+'|'+(item.programId||'');
  if(type==='races')return (item.name||'').toLowerCase().trim()+'|'+(item.date||'');
  return (item.title||'')+'|'+(item.startDate||'');
 };
 for(const type of ['sessions','planned','races','programs']){
  const ids=new Set(result[type].map(q=>q.id));const fps=new Set(result[type].map(q=>fingerprint(q,type)));
  for(const item of incoming[type]){const fp=fingerprint(item,type);if(!ids.has(item.id)&&!fps.has(fp)){result[type].push(item);ids.add(item.id);fps.add(fp)}}
 }
 result.restDays=[...new Set([...result.restDays,...incoming.restDays])];
 for(const k of Object.keys(result.settings))if(!result.settings[k]&&incoming.settings[k])result.settings[k]=incoming.settings[k];
 result.seedVersion=Math.max(result.seedVersion,incoming.seedVersion);
 return result;
}

 if(/brick|enchain|transition|combine/.test(a))return 'brick';
 if(/natat|swim|nage|piscine/.test(a))return 'swim';
 if(/velo|bike|cycl|vtt|home.train/.test(a))return 'bike';
 if(/course|running|run|footing|trail|athlet/.test(a))return 'run';
 if(/triathlon/.test(a))return 'brick';
 if(/enchain|transition|brick/.test(txt))return 'brick';
 if(/natat|nage|piscine/.test(txt))return 'swim';
 if(/velo|bike|cycl/.test(txt))return 'bike';
 return 'run';
}
function v5Goal(v,description='',sport='run'){
 const t=v5Norm(v||description);
 if(/semi|21[,.]1 ?km|21 ?km/.test(t))return 'semi';
 if(/10 ?km|10k\b/.test(t))return '10km';
 if(/5 ?km|5k\b/.test(t))return '5km';
 if(/3 ?km|3k\b/.test(t))return '3km';
 if(/2 ?km|2k\b/.test(t))return '2km';

 return 'general';
}

 /tempo|allure soutenue/.test(t)?'tempo':/specifi/.test(t)?'specifique':
 /techni/.test(t)?'technique':/endur|fondamental|zone 2|z2/.test(t)?'endurance':'endurance';

function v5Day(v){
 if(Number.isInteger(v)&&v>=0&&v<=6)return v;

 if(!raw||typeof raw!=='object')throw Error('Le fichier doit contenir un objet ou une liste.');

 if(Array.isArray(raw.sessions))all.push(...raw.sessions);
 if(raw.program)programs.push(raw.program);

 // Une sauvegarde complète est admise, mais seules ses séances sont importées.
 if(raw.data&&Array.isArray(raw.data.sessions))all.push(...raw.data.sessions);
 if(!all.length&&!programs.length)throw Error('Aucune séance ou aucun programme reconnu.');

 function addSession(s,parent=null,week=0){

  let description=v5String(s.description||s.instructions||'',8000);

   const lines=s.steps.slice(0,120).map(t=>{

  const mins=Number(s.minutes??s.durationMinutes??0);
  if(!Number.isFinite(mins)||mins<0||mins>1440)throw Error('Durée de séance incorrecte : '+name);
  const w=Number(s.week??week??0),day=v5Day(s.day??s.weekday);
  const raceName=v5Clean(s.raceName||parent?.raceName||'',150);
  const raceId=v5Clean(s.raceId||'',150);
  const goal=v5Goal(s.objective||parent?.objective||'',name+' '+description+' '+raceName,sport);
  const pid=parent?.id||v5Clean(s.programId||'',150);
  const category=v5Category(s.category||s.intensity||'',name+' '+description);
  const value={name,sport,category,objective:goal,description,minutes:Math.round(mins),
   goal:v5Clean(s.goal||parent?.goal||'',400),source:v5Clean(s.source||parent?.source||'Import JSON',200),
   raceName,raceId,programId:pid,programWeek:Number.isInteger(w)&&w>=0&&w<=104?w:0,
   programDay:day>=0?day:null};
  value.id='pack-'+v5Hash([value.programId,value.programWeek,value.programDay,value.name,value.description,value.sport].join('|'));
  out.push(value);
 }
 all.forEach(s=>addSession(s));
 for(const p of programs){
  if(!p||typeof p!=='object')throw Error('Programme non valide.');
  const name=v5String(p.name||p.title,150);
  if(!name)throw Error('Nom du programme manquant.');
  const id='pack-program-'+v5Hash(name+'|'+v5Norm(p.objective||''));
  const parent={id,name,sport:v5Clean(p.sport,40),objective:v5Clean(p.objective,80),
   raceName:v5Clean(p.raceName,150),goal:v5Clean(p.goal,400),source:v5Clean(p.source||name,200)};
  meta.push(parent);
  if(Array.isArray(p.sessions))p.sessions.forEach(s=>addSession(s,parent,Number(s?.week)||0));
  if(Array.isArray(p.weeks)){
   p.weeks.forEach((w,i)=>{
    if(!w||!Array.isArray(w.sessions))throw Error('Semaine invalide dans '+name);
    const week=Number(w.week??(i+1));
    if(!Number.isInteger(week)||week<1||week>104)throw Error('Numéro de semaine invalide.');
    w.sessions.forEach(s=>addSession(s,parent,week));
   });
  }
 }
 if(out.length>700||!out.length)throw Error('Il faut entre 1 et 700 séances.');
 return {sessions:out,programs:meta};
}
function v5Template(){
 return {format:V5_FORMAT,program:{name:'Mon programme 10 km',sport:'course à pied',objective:'10km',
  raceName:'',source:'Programme personnel',weeks:[
   {week:1,sessions:[{day:'mardi',name:'6 × 400 m',category:'vma',minutes:45,
    description:'Échauffement 15 min, 6 × 400 m, récupération 1 min 30, retour au calme.'},
    {day:'samedi',name:'Footing 50 min',category:'endurance',minutes:50,description:'Allure facile.'}]},
   {week:2,sessions:[{day:'jeudi',name:'Tempo 2 × 10 min',category:'tempo',minutes:50,
    description:'15 min faciles + 2 × 10 min tempo, récupération 3 min + retour au calme.'}]}
  ]}};
}
function v5DownloadTemplate(){
 const blob=new Blob([JSON.stringify(v5Template(),null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='modele-programme-triathlon.json';document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1200);
}
function v5Input(){
 let input=document.getElementById('v5-pack-input');if(input)return input;
 input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.id='v5-pack-input';input.hidden=true;document.body.append(input);
 input.addEventListener('change',async()=>{
  const file=input.files?.[0];input.value='';if(!file)return;
  try{
   if(file.size>5*1024*1024)throw Error('Fichier supérieur à 5 Mo.');
   const pack=v5Rows(JSON.parse(await file.text()));v5Pending=pack;
   const counts={};pack.sessions.forEach(x=>counts[x.sport]=(counts[x.sport]||0)+1);
   const labels={run:'Course à pied',bike:'Vélo',swim:'Natation',brick:'Enchaînement'};
   const grouped=Object.entries(counts).map(([k,n])=>`${n} ${labels[k]||k}`).join(' · ');
   const existing=new Set(data.sessions.map(x=>String(x.id)));
   const duplicates=pack.sessions.filter(x=>existing.has(x.id)||data.sessions.some(y=>y.name===x.name&&y.sport===x.sport&&y.description===x.description)).length;
   show('Importer des séances',`<p><strong>${pack.sessions.length} séance(s)</strong> détectée(s).</p>
    <p class="v5-mini">${escapeHTML(grouped)} · ${pack.programs.length} programme(s). ${duplicates} doublon(s) potentiels.</p>
    <p class="v5-mini">Les séances seront classées automatiquement par sport et par objectif. Aucune course ni séance existante ne sera supprimée.</p>
    <div class="actions">${btn('Ajouter à la bibliothèque','v5-confirm','','primary')}${btn('Annuler','v5-cancel')}</div>`);
  }catch(err){v5Pending=null;alert('Import impossible : '+err.message)}
 });
 return input;
}
function v5ImportClick(){v5Input().click();}
function v5Programs(){
 const items=Array.isArray(data.settings?.importedPrograms)?data.settings.importedPrograms:[];
 return items.map(p=>{
  const list=data.sessions.filter(x=>x.programId===p.id);
  return `<div class="v5-program"><strong>${escapeHTML(p.name)}</strong><div class="v5-mini">${list.length} séances importées · ${escapeHTML(p.objective||'Entraînement')}</div>
    <div class="actions">${btn('Voir les semaines','v5-program-view',p.id)}${btn('Programmer','v5-program-plan',p.id,'primary')}</div></div>`;
 }).join('');
}
const v5PreviousLibrary=renderLibrary;
renderLibrary=function(){
 let html=v5PreviousLibrary();
 if(libTab==='library'){
  const insert=`<div class="v5-import-link">${btn('Importer un JSON','v5-import','','primary')}${btn('Modèle JSON','v5-template')}</div>`;
  return html.includes('<div class="filters">')?html.replace('<div class="filters">',insert+'<div class="filters">'):insert+html;
 }
 if(libTab==='programs')return html+`<section class="section"><h2>Mes programmes importés</h2>${v5Programs()||'<p class="v5-mini">Aucun programme importé.</p>'}</section>`;
 return html;
};
const v5PreviousRaceCard=raceCard;
raceCard=function(x){
 const html=v5PreviousRaceCard(x);
 const normName=v5Norm(x.name);
 const related=data.sessions.filter(s=>s.raceId===x.id||(s.raceName&&v5Norm(s.raceName)===normName)).slice(0,12);
 if(!related.length)return html;
 const block=`<details class="v5-associations"><summary>${related.length} séance(s) liée(s) à cette course</summary><ul>${related.map(s=>`<li>${escapeHTML(s.name)} (${escapeHTML(NAMES[s.sport]||s.sport)})</li>`).join('')}</ul></details>`;
 return html.replace('<div class="actions">',block+'<div class="actions">');
};
function v5CollapseSettings(){
 const main=document.querySelector('main');if(!main)return;
 const headings=[...main.querySelectorAll('h2,h3')];
 for(const h of headings){
  const name=v5Norm(h.textContent),card=h.closest('.card,.panel');if(!card)continue;
  if(/^(reperes facultatifs|sur mon telephone|a propos du stockage|stockage local)$/.test(name)){
   const section=card.parentElement?.classList.contains('section')&&card.parentElement.children.length===1?card.parentElement:card;
   section.remove();continue;
  }
  if(/mes references|references sportives|mes parametres sportifs/.test(name)&&!card.closest('.v5-references')){
   const details=document.createElement('details');details.className='v5-references';
   const summary=document.createElement('summary');summary.textContent=h.textContent;
   const content=document.createElement('div');content.className='v5-references-content';
   h.remove();while(card.firstChild)content.append(card.firstChild);
   details.append(summary,content);card.replaceWith(details);
  }
 }
}
function v5Header(){
 const header=document.querySelector('body > header');if(!header)return;
 const save=[...header.querySelectorAll('button')].find(b=>/sauvegarde/i.test(b.textContent));
 if(save&&!save.classList.contains('v5-save-first')){
  save.classList.add('v5-save-first');save.parentElement.insertBefore(save,save.parentElement.firstChild);
 }
}
function v5AddModalImportButton(){
 const dialog=document.querySelector('dialog[open],dialog[style*="display: block"]');if(!dialog)return;
 const form=dialog.querySelector('form[data-form="session"],form[data-form="session-add"]');
 if(!form||dialog.querySelector('.v5-import-from-modal'))return;
 const area=document.createElement('div');area.className='v5-import-from-modal v5-import-link';
 area.innerHTML=btn('Importer plusieurs séances (JSON)','v5-import','','primary')+btn('Télécharger un modèle','v5-template');
 form.after(area);
}
const v5PreviousRender=render;
render=function(){v5PreviousRender();v5CollapseSettings();v5Header();};
function v5ProgramDetails(id){
 const p=(data.settings?.importedPrograms||[]).find(x=>x.id===id);if(!p)return;
 const list=data.sessions.filter(x=>x.programId===id).sort((a,b)=>(a.programWeek||0)-(b.programWeek||0)||(a.programDay??8)-(b.programDay??8));
 const groups=[...new Set(list.map(x=>x.programWeek||0))];
 show(p.name,groups.map(w=>`<details class="v5-program" ${w===groups[0]?'open':''}><summary><strong>Semaine ${w||'libre'}</strong></summary>
 ${list.filter(x=>(x.programWeek||0)===w).map(s=>`<p class="v5-mini"><strong>${escapeHTML(['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'][s.programDay]||'Jour libre')} : ${escapeHTML(s.name)}</strong><br>${escapeHTML(s.description)}</p>`).join('')}</details>`).join('')+`<div class="actions">${btn('Programmer','v5-program-plan',id,'primary')}</div>`);
}
function v5ProgramPlan(id){
 const p=(data.settings?.importedPrograms||[]).find(x=>x.id===id);if(!p)return;
 const now=new Date();now.setDate(now.getDate()+(8-now.getDay())%7);
 show('Programmer · '+p.name,`<p class="v5-mini">Le premier jour doit être un lundi. Seules les séances avec un jour défini seront placées.</p>
 <form data-form="v5-program-plan" data-id="${escapeHTML(id)}" class="form">
 ${field('Premier lundi','start',iso(now),'date',true)}${endForm('Programmer les séances')}</form>`);
}
function v5ConfirmImport(){
 if(!v5Pending)return;
 const incoming=v5Pending;
 const seen=new Set(data.sessions.map(s=>String(s.id)));
 const toAdd=[];
 for(const item of incoming.sessions){
  if(seen.has(item.id))continue;
  if(data.sessions.some(s=>s.sport===item.sport&&s.name===item.name&&s.description===item.description&&s.programId===item.programId&&(s.programWeek||0)===(item.programWeek||0)&&(s.programDay??-1)===(item.programDay??-1)))continue;
  const s={...item};
  if(!s.raceId&&s.raceName){const r=data.races.find(x=>v5Norm(x.name)===v5Norm(s.raceName));if(r)s.raceId=r.id;}
  toAdd.push(s);seen.add(s.id);
 }
 const oldPrograms=Array.isArray(data.settings.importedPrograms)?data.settings.importedPrograms:[];
 const newPrograms=[...oldPrograms];
 for(const meta of incoming.programs)if(!newPrograms.some(p=>p.id===meta.id))newPrograms.push(meta);
 data.sessions.push(...toAdd);data.settings.importedPrograms=newPrograms;
 try{
  save();const saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!saved||!Array.isArray(saved.sessions)||!toAdd.every(x=>saved.sessions.some(y=>y.id===x.id)))throw Error('Vérification de sauvegarde échouée.');
 }catch(err){
  data.sessions.splice(data.sessions.length-toAdd.length,toAdd.length);
  data.settings.importedPrograms=oldPrograms;
  alert('Stockage indisponible : import annulé. '+err.message);return;
 }
 v5Pending=null;close();render();alert(`${toAdd.length} séance(s) ajoutée(s). ${incoming.sessions.length-toAdd.length} doublon(s) ignoré(s).`);
}
// Met aussi l'import JSON en bas du formulaire d'ajout manuel.
if(typeof MutationObserver!=='undefined'){
 const watcher=new MutationObserver(()=>v5AddModalImportButton());
 watcher.observe(document.body,{childList:true,subtree:true});
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a;
 if(a==='session-new'||a==='session-add'||a==='new-session')setTimeout(v5AddModalImportButton,0);
 if(!['v5-import','v5-template','v5-confirm','v5-cancel','v5-program-view','v5-program-plan'].includes(a))return;
 e.preventDefault();e.stopImmediatePropagation();
 if(a==='v5-import')v5ImportClick();
 if(a==='v5-template')v5DownloadTemplate();
 if(a==='v5-confirm')v5ConfirmImport();
 if(a==='v5-cancel'){v5Pending=null;close();}
 if(a==='v5-program-view')v5ProgramDetails(b.dataset.id);
 if(a==='v5-program-plan')v5ProgramPlan(b.dataset.id);
},true);
document.addEventListener('submit',e=>{
 const f=e.target;if(f.dataset.form!=='v5-program-plan')return;
 e.preventDefault();e.stopImmediatePropagation();
 const start=f.querySelector('[name="start"]')?.value,id=f.dataset.id,first=new Date(start+'T12:00:00');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(start||'')||isNaN(first)||iso(first)!==start||first.getDay()!==1){alert('Choisis un lundi valide.');return;}
 const list=data.sessions.filter(x=>x.programId===id&&x.programWeek>0&&x.programDay!==null);
 let added=0;
 for(const s of list){
  const d=new Date(first);d.setDate(first.getDate()+7*(s.programWeek-1)+s.programDay);
  const date=iso(d);
  if(data.planned.some(x=>x.sourceSessionId===s.id&&x.date===date))continue;
  data.planned.push({...s,id:uid(),sourceSessionId:s.id,date,time:'',done:false});added++;
 }
 save();close();render();alert(`${added} séance(s) programmée(s).`);
},true);
// Glissement latéral pour naviguer entre les cinq onglets, sans gêner les filtres.
let v5Touch=null;
document.addEventListener('touchstart',e=>{
 const t=e.touches[0];v5Touch=t?{x:t.clientX,y:t.clientY,blocked:!!e.target.closest('dialog,button,input,textarea,select,a,details,.filters,.calgrid')}:null;
},{passive:true});
document.addEventListener('touchend',e=>{
 if(!v5Touch||v5Touch.blocked)return;
 const t=e.changedTouches[0],dx=t.clientX-v5Touch.x,dy=t.clientY-v5Touch.y;v5Touch=null;
 if(Math.abs(dx)<110||Math.abs(dx)<Math.abs(dy)*1.8)return;
 const buttons=[...document.querySelectorAll('nav button[data-tab]')];
 const current=buttons.findIndex(x=>x.classList.contains('active'));
 const next=current+(dx<0?1:-1);
 if(current>=0&&next>=0&&next<buttons.length)buttons[next].click();
},{passive:true});
document.addEventListener('click',e=>{
 if(e.target.closest('nav button')){
  const reset=()=>{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;};
  requestAnimationFrame(reset);setTimeout(reset,100);
 }
},true);

render();
})();
